[package]
name = "geotable"
version = "0.1.0"
description = "GeoTable desktop attribute table tool"
authors = ["GeoTable contributors"]
edition = "2021"

[lib]
# `_lib` 后缀用于确保库名称唯一，避免与二进制名称冲突；Windows 下尤其需要此命名。
name = "geotable_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2.7.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.19"
shapefile = { version = "0.9.0", features = ["encoding_rs"] }
kml = "0.14.0"
zip = "2.4.2"
geo = "0.33.1"
geojson = "1.0.0"
rstar = "0.13.0"
csv = "1.4.0"

[dev-dependencies]
tempfile = "3"
pretty_assertions = "1"
