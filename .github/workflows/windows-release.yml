name: Windows Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag. 留空时使用 package.json 版本和 run number 生成测试发布 tag。"
        required: false
        type: string
      prerelease:
        description: "Mark the GitHub release as prerelease"
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  PNPM_VERSION: 10.19.0

jobs:
  test:
    name: Test
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Rust
        shell: pwsh
        run: rustup default stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: windows-cargo-test-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            windows-cargo-test-
            windows-cargo-

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Run frontend tests
        run: pnpm test

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

  build-windows:
    name: Build Windows Executable
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Rust
        shell: pwsh
        run: rustup default stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: windows-cargo-build-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            windows-cargo-build-
            windows-cargo-

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri Windows bundle
        run: pnpm tauri build

      - name: Collect Windows release assets
        shell: pwsh
        run: |
          $assetsDir = Join-Path $PWD "release-assets"
          New-Item -ItemType Directory -Force -Path $assetsDir | Out-Null

          $assets = @()
          $rawExe = Join-Path $PWD "src-tauri\target\release\geotable.exe"
          if (Test-Path -LiteralPath $rawExe) {
            $assets += Get-Item -LiteralPath $rawExe
          }

          $bundleDir = Join-Path $PWD "src-tauri\target\release\bundle"
          if (Test-Path -LiteralPath $bundleDir) {
            $assets += Get-ChildItem -LiteralPath $bundleDir -Recurse -File |
              Where-Object { $_.Extension -in @(".exe", ".msi") }
          }

          if ($assets.Count -eq 0) {
            throw "No Windows executable or installer assets were produced."
          }

          foreach ($asset in $assets) {
            Copy-Item -LiteralPath $asset.FullName -Destination $assetsDir -Force
          }

          Get-ChildItem -LiteralPath $assetsDir -File |
            Select-Object Name, Length |
            Format-Table -AutoSize

      - name: Upload Windows build artifact
        uses: actions/upload-artifact@v4
        with:
          name: geotable-windows-${{ github.sha }}
          path: release-assets/*
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    runs-on: windows-latest
    needs:
      - build-windows

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Windows build artifact
        uses: actions/download-artifact@v4
        with:
          name: geotable-windows-${{ github.sha }}
          path: release-assets

      - name: Resolve release tag
        id: release
        shell: pwsh
        run: |
          $inputTag = "${{ inputs.tag_name }}"
          if ("${{ github.ref_type }}" -eq "tag") {
            $tag = "${{ github.ref_name }}"
          } elseif (-not [string]::IsNullOrWhiteSpace($inputTag)) {
            $tag = $inputTag
          } else {
            $package = Get-Content -Encoding UTF8 package.json -Raw | ConvertFrom-Json
            $tag = "v$($package.version)-build-${{ github.run_number }}"
          }

          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Create or update GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ steps.release.outputs.tag }}"
          $assetPaths = @(Get-ChildItem -LiteralPath "release-assets" -File | ForEach-Object { $_.FullName })
          if ($assetPaths.Count -eq 0) {
            throw "No release assets found."
          }

          $releaseExists = $false
          try {
            gh release view $tag *> $null
            $releaseExists = $LASTEXITCODE -eq 0
          } catch {
            $releaseExists = $false
          }

          if ($releaseExists) {
            $uploadArgs = @("release", "upload", $tag) + $assetPaths + @("--clobber")
            & gh @uploadArgs
            exit $LASTEXITCODE
          }

          $createArgs = @(
            "release",
            "create",
            $tag
          ) + $assetPaths + @(
            "--target",
            "${{ github.sha }}",
            "--title",
            "GeoTable $tag",
            "--notes",
            "Automated Windows build from commit ${{ github.sha }}."
          )

          if ("${{ inputs.prerelease }}" -eq "true") {
            $createArgs += "--prerelease"
          }

          & gh @createArgs
