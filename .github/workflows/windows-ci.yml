name: Windows CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  PNPM_VERSION: 10.19.0

jobs:
  build-windows:
    name: Build Windows Executable
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Rust
        shell: pwsh
        run: rustup default stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: windows-cargo-build-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            windows-cargo-build-
            windows-cargo-

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri Windows bundle
        run: pnpm tauri build

      - name: Collect Windows build assets
        shell: pwsh
        run: |
          $assetsDir = Join-Path $PWD "ci-artifacts"
          New-Item -ItemType Directory -Force -Path $assetsDir | Out-Null

          $assets = @()
          $rawExe = Join-Path $PWD "src-tauri\target\release\geotable.exe"
          if (Test-Path -LiteralPath $rawExe) {
            $assets += Get-Item -LiteralPath $rawExe
          }

          $bundleDir = Join-Path $PWD "src-tauri\target\release\bundle"
          if (Test-Path -LiteralPath $bundleDir) {
            $assets += Get-ChildItem -LiteralPath $bundleDir -Recurse -File |
              Where-Object { $_.Extension -in @(".exe", ".msi") }
          }

          if ($assets.Count -eq 0) {
            throw "No Windows executable or installer assets were produced."
          }

          foreach ($asset in $assets) {
            Copy-Item -LiteralPath $asset.FullName -Destination $assetsDir -Force
          }

          Get-ChildItem -LiteralPath $assetsDir -File |
            Select-Object Name, Length |
            Format-Table -AutoSize

      - name: Upload Windows build artifact
        uses: actions/upload-artifact@v4
        with:
          name: geotable-windows-${{ github.sha }}
          path: ci-artifacts/*
          if-no-files-found: error

  test:
    name: Test
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Rust
        shell: pwsh
        run: rustup default stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: windows-cargo-test-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            windows-cargo-test-
            windows-cargo-

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Run frontend tests
        run: pnpm test

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
